[package]
name = "ranki"
version = "0.2.0"
edition = "2021"

[dependencies]
anki = { path = "anki/rslib" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
