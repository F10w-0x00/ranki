name: RAnki ARMEL Cross-Compilation CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build ranki-armel (Route B + GLIBC <= 2.20 Gate)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify Route B Card Renderer Gates (ES5, Unit Tests, 876 Formulas)
        run: |
          npm ci
          node tools/check_es5.js views/card.js
          node tools/check_es5.js --syntax-only views/katex/katex.min.js
          node tools/check_es5.js --syntax-only views/katex/mhchem.min.js
          node tools/check_es5.js --syntax-only views/katex/auto-render.min.js
          node tools/test_card_engine.js
          node tools/test_regression.js

      - name: Build Builder Docker Image
        run: |
          echo "Building docker image from Dockerfile.armel..."
          docker build -t ranki-armel-builder -f Dockerfile.armel .

      - name: Execute Rust Unit Tests & Containerized ARMEL Build Pipeline
        run: |
          set -o pipefail
          chmod +x tools/ci_build_armel.sh
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            ranki-armel-builder \
            /bin/bash /workspace/tools/ci_build_armel.sh 2>&1 | tee build.log

      - name: Upload Build Failure Telemetry
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build.log

      - name: Record Build Evidence & Telemetry
        run: |
          mkdir -p evidence/m0/ci_output
          file build/ranki-armel > evidence/m0/ci_output/file.txt
          sha256sum build/ranki-armel > evidence/m0/ci_output/sha256.txt
          readelf -V build/ranki-armel > evidence/m0/ci_output/readelf_V.txt
          readelf -d build/ranki-armel > evidence/m0/ci_output/readelf_d.txt
          readelf -h build/ranki-armel > evidence/m0/ci_output/readelf_h.txt
          readelf -A build/ranki-armel > evidence/m0/ci_output/readelf_A.txt

      - name: Upload Binary Artifact (ranki-armel)
        uses: actions/upload-artifact@v4
        with:
          name: ranki-armel
          path: build/ranki-armel
          if-no-files-found: error
