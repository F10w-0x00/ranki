<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAnki Card Canvas</title>
    <link rel="stylesheet" href="card.css">
    <style id="card-note-style"></style>
    <style id="card-font-override"></style>
    <!-- Battle-Tested Primary Math Engine for Kindle PW3 WebKitGTK 1.0: MathJax 2.7.9 -->
    <script type="text/x-mathjax-config">
        MathJax.Hub.Config({
            showProcessingMessages: false,
            messageStyle: "none",
            skipStartupTypeset: true,
            extensions: ["tex2jax.js"],
            jax: ["input/TeX", "output/HTML-CSS"],
            tex2jax: {
                inlineMath: [["$", "$"], ["\\(", "\\)"]],
                displayMath: [["$$", "$$"], ["\\[", "\\]"]],
                processEscapes: true
            },
            TeX: {
                mhchem: { legacy: false },
                extensions: [
                    "AMSmath.js",
                    "AMSsymbols.js",
                    "mhchem.js",
                    "extpfeil.js",
                    "color.js",
                    "bbox.js",
                    "cancel.js",
                    "enclose.js",
                    "newcommand.js",
                    "noErrors.js",
                    "noUndefined.js"
                ],
                noErrors: { disabled: false },
                noUndefined: { disabled: false }
            },
            "HTML-CSS": {
                scale: 105,
                availableFonts: ["TeX"],
                preferredFont: "TeX",
                webFont: "TeX",
                imageFont: null,
                matchFontHeight: false,
                linebreaks: { automatic: false }
            }
        });
    </script>
    <script src="mathjax/MathJax.js?config=TeX-AMS_HTML"></script>
</head>
<body>
    <!-- Group A: 2 Slots (Front / Back) -->
    <div id="slot-a-front" class="slot-viewport">
        <div class="slot-scroller">
            <div id="card-a-front" class="card kindle"></div>
        </div>
    </div>
    <div id="slot-a-back" class="slot-viewport offscreen">
        <div class="slot-scroller">
            <div id="card-a-back" class="card kindle"></div>
        </div>
    </div>

    <!-- Group B: 2 Prefetch Slots (Front / Back) -->
    <div id="slot-b-front" class="slot-viewport offscreen">
        <div class="slot-scroller">
            <div id="card-b-front" class="card kindle"></div>
        </div>
    </div>
    <div id="slot-b-back" class="slot-viewport offscreen">
        <div class="slot-scroller">
            <div id="card-b-back" class="card kindle"></div>
        </div>
    </div>

    <!-- Empty / Finished State -->
    <div id="slot-finished" class="slot-viewport offscreen">
        <div class="finished-wrap">
            <div class="finished-mark"></div>
            <div id="finished-title" class="finished-title">Congratulations!</div>
            <div id="finished-sub" class="finished-sub">You have finished this deck for now.</div>
        </div>
    </div>

    <script src="card.js"></script>
</body>
</html>
