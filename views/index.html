<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1072, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAnki</title>
    <link rel="stylesheet" href="style.css">
    <style id="card-dynamic-style"></style>
    <!-- MathJax 2.7.9 Configuration -->
    <script type="text/x-mathjax-config">
      MathJax.Hub.Config({
        showProcessingMessages: false,
        messageStyle: "none",
        skipStartupTypeset: true,
        extensions: ["tex2jax.js"],
        jax: ["input/TeX", "output/HTML-CSS"],
        tex2jax: {
          inlineMath: [ ['$','$'], ["\\(","\\)"] ],
          displayMath: [ ['$$','$$'], ["\\[","\\]"] ],
          processEscapes: true
        },
        TeX: {
          extensions: [
            "AMSmath.js",
            "AMSsymbols.js",
            "mhchem.js",
            "extpfeil.js",
            "color.js",
            "bbox.js",
            "newcommand.js",
            "noErrors.js",
            "noUndefined.js"
          ],
          noErrors: { disabled: false },
          noUndefined: { disabled: false }
        },
        "HTML-CSS": {
          scale: 110,
          availableFonts: ["TeX"],
          preferredFont: "TeX",
          webFont: "TeX",
          imageFont: null,
          matchFontHeight: false,
          linebreaks: { automatic: false }
        }
      });
    </script>
    <script src="mathjax/MathJax.js?config=TeX-AMS_HTML"></script>
</head>
<body>
    <!-- Top 64px Anki Header Bar -->
    <div class="header-bar">
        <!-- Left: Brand (Deck View) or Back Button (Review View) -->
        <div class="header-left">
            <div id="deck-header-brand" class="brand-group">
                <span class="brand-title">RAnki</span>
                <span id="deck-subtitle" class="brand-sub">待复习: 0 张</span>
            </div>
            <button id="btn-back" class="header-btn" style="display: none;">&lt; 牌组</button>
        </div>

        <!-- Center: Current Deck Name (Review View) -->
        <div class="header-center">
            <span id="deck-title" style="display: none;">牌组</span>
        </div>

        <!-- Right: Actions (Sync, Settings, Exit or Badges) -->
        <div class="header-right">
            <div id="deck-actions" class="deck-actions-group">
                <button id="btn-sync" class="header-action-btn" title="同步 AnkiWeb"><svg class="header-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg><span>同步</span></button>
                <button id="btn-settings" class="header-action-btn" title="账号与设置"><svg class="header-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg><span>设置</span></button>
                <button id="btn-exit" class="header-action-btn" title="退出程序">退出</button>
            </div>
            <div id="header-badges" class="review-badges" style="display: none;">
                <span class="badge-item" id="badge-due">0</span>
            </div>
        </div>
    </div>

    <!-- View 1: Anki-Authentic Deck Browser (No 1990s Table Grid) -->
    <div id="deck-view">
        <div class="deck-container">
            <div id="deck-list" class="deck-list-body">
                <div class="empty-msg">正在读取卡片数据库...</div>
            </div>
            <!-- E-ink Paged Controls (Prev / Info / Next / Refresh) -->
            <div class="deck-pager">
                <button id="btn-page-prev" class="pager-btn">&lt; 上一页</button>
                <span id="deck-page-info" class="pager-info">第 1 / 1 页</span>
                <button id="btn-page-next" class="pager-btn">下一页 &gt;</button>
                <button id="btn-refresh-screen" class="pager-btn pager-refresh" title="清除电子墨水残影">刷新屏幕</button>
            </div>
            <div class="deck-footer">
                <div id="deck-summary" class="deck-summary-text">今天在 0 秒内学习了 0 张卡片 (平均每张卡片 0 秒)</div>
            </div>
        </div>
    </div>

    <!-- View 2: Card Review Core Area (Quad-Slot Architecture) -->
    <div id="review-view" style="display: none;">
        <!-- Card Content Core Area -->
        <div class="card-area">
            <!-- Group A: Card N -->
            <div id="slot-a-front" class="card-box"></div>
            <div id="slot-a-back"  class="card-box offscreen"></div>

            <!-- Group B: Card N+1 (Offscreen Pre-rendering Pipeline) -->
            <div id="slot-b-front" class="card-box offscreen"></div>
            <div id="slot-b-back"  class="card-box offscreen"></div>

            <!-- Panel: Deck Finished Celebration -->
            <div id="panel-finished" class="celebration-panel" style="display: none;">
                <h2>🎉 今日复习完成</h2>
                <p id="finished-stats">今日复习已告一段落，目前没有更多待复习卡片。</p>
                <button id="btn-finished-back" class="celebration-btn">返回牌组大厅</button>
            </div>
        </div>

        <!-- Bottom 110px Pinned Touch Action Bar (Option A Two-Line Layout) -->
        <div class="action-bar">
            <!-- State 1: Unflipped (Show Answer) -->
            <div id="bar-unflipped">
                <button id="btn-show-answer" class="btn-full">点 击 显 示 答 案</button>
            </div>

            <!-- State 2: Flipped (Option A Dual-Tier Ratings via bulletproof Table Layout) -->
            <div id="bar-flipped" style="display: none;">
                <table class="btn-group-table">
                    <tr>
                        <td class="rate-td">
                            <button id="btn-again" class="rate-btn">
                                <span class="btn-interval" id="interval-again">&lt; 10分</span>
                                <span class="btn-label">重来</span>
                            </button>
                        </td>
                        <td class="rate-td">
                            <button id="btn-hard" class="rate-btn">
                                <span class="btn-interval" id="interval-hard">1天</span>
                                <span class="btn-label">困难</span>
                            </button>
                        </td>
                        <td class="rate-td">
                            <button id="btn-good" class="rate-btn">
                                <span class="btn-interval" id="interval-good">3天</span>
                                <span class="btn-label">良好</span>
                            </button>
                        </td>
                        <td class="rate-td">
                            <button id="btn-easy" class="rate-btn">
                                <span class="btn-interval" id="interval-easy">5天</span>
                                <span class="btn-label">简单</span>
                            </button>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal 1: Settings & AnkiWeb Login -->
    <div id="modal-settings" class="modal-backdrop" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">AnkiWeb 账号与同步设置</div>
            <div class="modal-body">
                <div id="setting-status-badge" class="setting-status">检测中...</div>
                <div class="form-group">
                    <label class="form-label">账号 / 邮箱 (Email):</label>
                    <input type="text" id="setting-user" class="form-input" placeholder="输入 AnkiWeb 注册邮箱">
                </div>
                <div class="form-group">
                    <label class="form-label">密码 (Password):</label>
                    <input type="password" id="setting-pass" class="form-input" placeholder="输入密码">
                </div>
                <div class="form-group">
                    <label class="form-label">自定义服务器 (留空使用官方 AnkiWeb):</label>
                    <input type="text" id="setting-server" class="form-input" placeholder="https://ankiweb.net/">
                </div>
            </div>
            <div class="modal-footer">
                <button id="btn-modal-login" class="modal-btn modal-btn-primary">登录并同步</button>
                <button id="btn-modal-save" class="modal-btn">保存设置</button>
                <button id="btn-modal-close" class="modal-btn modal-btn-cancel">取消</button>
            </div>
        </div>
    </div>

    <!-- Modal 2: Sync Progress Overlay -->
    <div id="modal-sync" class="modal-backdrop" style="display: none;">
        <div class="modal-sync-card">
            <div class="sync-spinner">
                <svg class="sync-spinner-icon" viewBox="0 0 24 24" width="64" height="64"><path fill="#000000" d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
            </div>
            <div class="sync-title">正在与云端同步...</div>
            <div class="sync-desc">正在双向同步牌组与卡片进度，请保持 Wi-Fi 连接</div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast-box" style="display: none;"></div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
